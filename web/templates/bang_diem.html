    <meta name="description" content="Quản lý điểm và tính GPA thang 4, cảnh báo học vụ, mô phỏng mục tiêu điểm số, gom nhóm học kỳ và đồng bộ đám mây đa thiết bị." />

    <!-- PWA & Favicon -->

    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Chống chớp sáng (FOUC) khi dùng Dark mode -->
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("app_prefs") || "{}");
        const t = p.theme === "light" || p.theme === "dark" 
          ? p.theme 
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
